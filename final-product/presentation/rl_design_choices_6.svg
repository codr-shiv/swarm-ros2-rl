<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" font-family="sans-serif" font-size="13">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1100" height="560" fill="white"/>
<rect x="30" y="16" width="1040" height="92" rx="12" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/>
<rect x="137.33333333333334" y="30" width="132" height="22" rx="11" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.4"/>
<text x="203.33333333333334" y="45" font-size="11" text-anchor="middle" fill="#1F5FA8" font-weight="bold">OBSERVATION</text>
<text x="203.33333333333334" y="74" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">153 numbers per decision</text>
<text x="203.33333333333334" y="91" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">12 frontiers × 12 features + 9 global</text>
<rect x="484.0" y="30" width="132" height="22" rx="11" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.4"/>
<text x="550.0" y="45" font-size="11" text-anchor="middle" fill="#7B3FA6" font-weight="bold">ACTION</text>
<text x="550.0" y="74" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">pick 1 of the 12</text>
<text x="550.0" y="91" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">nearest frontiers</text>
<rect x="830.6666666666666" y="30" width="132" height="22" rx="11" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.4"/>
<text x="896.6666666666666" y="45" font-size="11" text-anchor="middle" fill="#B26A00" font-weight="bold">REWARD</text>
<text x="896.6666666666666" y="86" font-size="19" text-anchor="middle" fill="#222" font-weight="bold" font-family="serif" font-style="italic">r = 0.1 · ΔA − 0.01 · Δt</text>
<line x1="376.6666666666667" y1="30" x2="376.6666666666667" y2="94" stroke="#E2E2E2" stroke-width="1.5"/>
<line x1="723.3333333333334" y1="30" x2="723.3333333333334" y2="94" stroke="#E2E2E2" stroke-width="1.5"/>
<rect x="30" y="122" width="1040" height="424" rx="12" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/>
<line x1="620" y1="142" x2="620" y2="526" stroke="#E2E2E2" stroke-width="1.5"/>
<text x="325" y="152" font-size="11" text-anchor="middle" fill="#999" font-weight="bold" letter-spacing="1">THE NETWORK</text>
<rect x="265" y="167" width="120" height="44" rx="8" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.6"/>
<text x="325.0" y="187.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">153</text>
<text x="325.0" y="201.0" font-size="10.5" text-anchor="middle" fill="#666">observation</text>
<rect x="85" y="218" width="220" height="316" rx="12" fill="#F7F0FB" stroke="#D9C4E8" stroke-width="1.4"/>
<text x="195" y="238" font-size="12" text-anchor="middle" fill="#7B3FA6" font-weight="bold" letter-spacing="1">ACTOR</text>
<text x="195" y="252" font-size="11" text-anchor="middle" fill="#7B3FA6">which frontier?</text>
<rect x="345" y="218" width="220" height="316" rx="12" fill="#F7F0FB" stroke="#D9C4E8" stroke-width="1.4"/>
<text x="455" y="238" font-size="12" text-anchor="middle" fill="#7B3FA6" font-weight="bold" letter-spacing="1">CRITIC</text>
<text x="455" y="252" font-size="11" text-anchor="middle" fill="#7B3FA6">how good is this state?</text>
<path d="M265,189 L195,189 L195,218" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M385,189 L455,189 L455,218" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="115" y="264" width="160" height="36" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="195.0" y="280.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">Hidden layer 1</text>
<text x="195.0" y="294.0" font-size="10.5" text-anchor="middle" fill="#666">128 neurons</text>
<rect x="115" y="324" width="160" height="36" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="195.0" y="340.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">Hidden layer 2</text>
<text x="195.0" y="354.0" font-size="10.5" text-anchor="middle" fill="#666">128 neurons</text>
<path d="M195,300 L195,324" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="115" y="384" width="160" height="36" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="195.0" y="400.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">12 scores</text>
<text x="195.0" y="414.0" font-size="10.5" text-anchor="middle" fill="#666">one per slot</text>
<path d="M195,360 L195,384" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="115" y="444" width="160" height="36" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="195.0" y="460.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">mask + softmax</text>
<text x="195.0" y="474.0" font-size="10.5" text-anchor="middle" fill="#666">invalid slots → 0</text>
<path d="M195,420 L195,444" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="375" y="264" width="160" height="36" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="455.0" y="280.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">Hidden layer 1</text>
<text x="455.0" y="294.0" font-size="10.5" text-anchor="middle" fill="#666">128 neurons</text>
<rect x="375" y="324" width="160" height="36" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="455.0" y="340.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">Hidden layer 2</text>
<text x="455.0" y="354.0" font-size="10.5" text-anchor="middle" fill="#666">128 neurons</text>
<path d="M455,300 L455,324" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="375" y="384" width="160" height="36" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="455.0" y="400.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">V(s)</text>
<text x="455.0" y="414.0" font-size="10.5" text-anchor="middle" fill="#666">1 number</text>
<path d="M455,360 L455,384" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M195,480 L195,492" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="195" y="512" font-size="16" text-anchor="middle" fill="#222" font-weight="bold" font-family="serif" font-style="italic">π(slot | s)</text>
<text x="195" y="526" font-size="10.5" text-anchor="middle" fill="#666">probability of each slot</text>
<path d="M455,420 L455,432" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="455" y="450" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">expected return from here</text>
<text x="455" y="465" font-size="10.5" text-anchor="middle" fill="#666">the baseline to judge actions against</text>
<text x="847" y="152" font-size="11" text-anchor="middle" fill="#999" font-weight="bold" letter-spacing="1">THE TRAINING LOOP (PPO)</text>
<rect x="668" y="168" width="370" height="46" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="191.0" r="11" fill="#2E7D32"/>
<text x="651" y="195.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">1</text>
<text x="680" y="187" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Collect experience</text>
<text x="680" y="204" font-size="11" text-anchor="start" fill="#555">run <tspan font-family="serif" font-style="italic" font-size="13" fill="#222">π</tspan> in 8 simulators for 256 decisions</text>
<path d="M651,202.0 L651,240.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="668" y="228" width="370" height="46" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="251.0" r="11" fill="#2E7D32"/>
<text x="651" y="255.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">2</text>
<text x="680" y="247" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Score every decision (advantage)</text>
<text x="680" y="264" font-size="11" text-anchor="start" fill="#555"><tspan font-family="serif" font-style="italic" font-size="13" fill="#222">Â = R − V(s)</tspan></text>
<path d="M651,262.0 L651,300.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="668" y="288" width="370" height="46" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="311.0" r="11" fill="#2E7D32"/>
<text x="651" y="315.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">3</text>
<text x="680" y="307" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Update the actor (clipped)</text>
<text x="680" y="324" font-size="11" text-anchor="start" fill="#555">raise <tspan font-family="serif" font-style="italic" font-size="13" fill="#222">π</tspan> where <tspan font-family="serif" font-style="italic" font-size="13" fill="#222">Â &gt; 0</tspan>, lower where <tspan font-family="serif" font-style="italic" font-size="13" fill="#222">Â &lt; 0</tspan></text>
<path d="M651,322.0 L651,360.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="668" y="348" width="370" height="46" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="371.0" r="11" fill="#2E7D32"/>
<text x="651" y="375.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">4</text>
<text x="680" y="367" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Update the critic</text>
<text x="680" y="384" font-size="11" text-anchor="start" fill="#555">fit <tspan font-family="serif" font-style="italic" font-size="13" fill="#222">V(s)</tspan> to the real return <tspan font-family="serif" font-style="italic" font-size="13" fill="#222">R</tspan></text>
<path d="M1038,371.0 L1052,371.0 L1052,191.0 L1038,191.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1064" y="281.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold" transform="rotate(-90 1064 281.0)">repeat</text>
<rect x="642" y="412" width="410" height="122" rx="10" fill="white" stroke="#CCC" stroke-width="1.5"/>
<text x="847.0" y="432" font-size="10.5" text-anchor="middle" fill="#999" font-weight="bold" letter-spacing="0.5">THE OBJECTIVE: maximised on every minibatch</text>
<text x="652" y="468" font-size="18" text-anchor="start" fill="#222" font-weight="bold" font-family="serif" font-style="italic">J(θ) =</text>
<text x="754" y="468" font-size="17" text-anchor="middle" fill="#7B3FA6" font-weight="bold" font-family="serif" font-style="italic">J<tspan dy="5" font-size="12">CLIP</tspan><tspan dy="-5"> </tspan></text>
<rect x="708" y="477" width="92" height="3" rx="1.5" fill="#7B3FA6"/>
<text x="754" y="498" font-size="11" text-anchor="middle" fill="#7B3FA6" font-weight="bold">improve the actor</text>
<text x="754" y="514" font-size="11.5" text-anchor="middle" fill="#555" font-family="serif" font-style="italic">min(ρÂ, clip(ρ)·Â)</text>
<text x="874" y="468" font-size="17" text-anchor="middle" fill="#1F5FA8" font-weight="bold" font-family="serif" font-style="italic">0.5 · E<tspan dy="5" font-size="12">VF</tspan><tspan dy="-5"> </tspan></text>
<rect x="828" y="477" width="92" height="3" rx="1.5" fill="#1F5FA8"/>
<text x="874" y="498" font-size="11" text-anchor="middle" fill="#1F5FA8" font-weight="bold">fix the critic’s errors</text>
<text x="874" y="514" font-size="11.5" text-anchor="middle" fill="#555" font-family="serif" font-style="italic">(V(s) − R)²</text>
<text x="992" y="468" font-size="17" text-anchor="middle" fill="#B26A00" font-weight="bold" font-family="serif" font-style="italic">0.01 · H(π)</text>
<rect x="946" y="477" width="92" height="3" rx="1.5" fill="#B26A00"/>
<text x="992" y="498" font-size="11" text-anchor="middle" fill="#B26A00" font-weight="bold">entropy bonus</text>
<text x="992" y="514" font-size="11.5" text-anchor="middle" fill="#555" font-family="serif" font-style="italic">keep exploring</text>
<text x="814" y="468" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">−</text>
<text x="933" y="468" font-size="20" text-anchor="middle" fill="#222" font-weight="bold">+</text>
</svg>