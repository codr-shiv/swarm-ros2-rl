<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" font-family="sans-serif" font-size="13">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<rect width="1100" height="560" fill="white"/>
<text x="550.0" y="32" text-anchor="middle" font-size="20" font-weight="bold">RL brain: how the decision is learned</text>
<rect x="30" y="60" width="1040" height="96" rx="12" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/>
<rect x="137.33333333333334" y="76" width="132" height="22" rx="11" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.4"/>
<text x="203.33333333333334" y="91" font-size="11" text-anchor="middle" fill="#1F5FA8" font-weight="bold">OBSERVATION</text>
<text x="203.33333333333334" y="122" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">153 numbers per decision</text>
<text x="203.33333333333334" y="139" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">12 frontiers × 12 features + 9 global</text>
<rect x="484.0" y="76" width="132" height="22" rx="11" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.4"/>
<text x="550.0" y="91" font-size="11" text-anchor="middle" fill="#7B3FA6" font-weight="bold">ACTION</text>
<text x="550.0" y="122" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">pick 1 of the 12</text>
<text x="550.0" y="139" font-size="13" text-anchor="middle" fill="#333" font-weight="bold">nearest frontiers</text>
<rect x="830.6666666666666" y="76" width="132" height="22" rx="11" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.4"/>
<text x="896.6666666666666" y="91" font-size="11" text-anchor="middle" fill="#B26A00" font-weight="bold">REWARD</text>
<text x="896.6666666666666" y="134" font-size="19" text-anchor="middle" fill="#222" font-weight="bold" font-family="serif" font-style="italic">r = 0.1 · ΔA − 0.01 · Δt</text>
<line x1="376.6666666666667" y1="76" x2="376.6666666666667" y2="140" stroke="#E2E2E2" stroke-width="1.5"/>
<line x1="723.3333333333334" y1="76" x2="723.3333333333334" y2="140" stroke="#E2E2E2" stroke-width="1.5"/>
<rect x="30" y="170" width="1040" height="378" rx="12" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/>
<text x="48" y="200" font-size="16" font-weight="bold">Actor-critic network, trained with PPO</text>
<line x1="620" y1="218" x2="620" y2="528" stroke="#E2E2E2" stroke-width="1.5"/>
<text x="48" y="226" font-size="11" text-anchor="start" fill="#999" font-weight="bold" letter-spacing="1">THE NETWORK</text>
<rect x="245" y="222" width="120" height="44" rx="8" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.6"/>
<text x="305.0" y="242.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">153</text>
<text x="305.0" y="256.0" font-size="10.5" text-anchor="middle" fill="#666">observation</text>
<path d="M245,244 L190,244 L190,286" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M365,244 L420,244 L420,286" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="180" y="262" font-size="11.5" text-anchor="end" fill="#7B3FA6" font-weight="bold">ACTOR</text>
<text x="180" y="276" font-size="11" text-anchor="end" fill="#7B3FA6">which frontier?</text>
<text x="430" y="262" font-size="11.5" text-anchor="start" fill="#7B3FA6" font-weight="bold">CRITIC</text>
<text x="430" y="276" font-size="11" text-anchor="start" fill="#7B3FA6">how good is this state?</text>
<rect x="120" y="286" width="140" height="34" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="190.0" y="301.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">128</text>
<text x="190.0" y="315.0" font-size="10.5" text-anchor="middle" fill="#666">tanh</text>
<rect x="120" y="340" width="140" height="34" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="190.0" y="355.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">128</text>
<text x="190.0" y="369.0" font-size="10.5" text-anchor="middle" fill="#666">tanh</text>
<path d="M190,320 L190,340" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="120" y="394" width="140" height="34" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="190.0" y="409.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">12 scores</text>
<text x="190.0" y="423.0" font-size="10.5" text-anchor="middle" fill="#666">one per slot</text>
<path d="M190,374 L190,394" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="120" y="448" width="140" height="34" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="190.0" y="463.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">mask + softmax</text>
<text x="190.0" y="477.0" font-size="10.5" text-anchor="middle" fill="#666">invalid slots → 0</text>
<path d="M190,428 L190,448" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="350" y="286" width="140" height="34" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="420.0" y="301.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">128</text>
<text x="420.0" y="315.0" font-size="10.5" text-anchor="middle" fill="#666">tanh</text>
<rect x="350" y="340" width="140" height="34" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="420.0" y="355.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">128</text>
<text x="420.0" y="369.0" font-size="10.5" text-anchor="middle" fill="#666">tanh</text>
<path d="M420,320 L420,340" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="350" y="394" width="140" height="34" rx="8" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.6"/>
<text x="420.0" y="409.0" font-size="12.5" text-anchor="middle" fill="#333" font-weight="bold">V(s)</text>
<text x="420.0" y="423.0" font-size="10.5" text-anchor="middle" fill="#666">1 number</text>
<path d="M420,374 L420,394" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M190,482 L190,496" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="190" y="514" font-size="16" text-anchor="middle" fill="#222" font-weight="bold" font-family="serif" font-style="italic">π(slot | s)</text>
<text x="190" y="529" font-size="10.5" text-anchor="middle" fill="#666">probability of each slot</text>
<path d="M420,428 L420,442" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="420" y="460" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">expected return from here</text>
<text x="420" y="475" font-size="10.5" text-anchor="middle" fill="#666">the baseline to judge actions against</text>
<text x="642" y="226" font-size="11" text-anchor="start" fill="#999" font-weight="bold" letter-spacing="1">THE TRAINING LOOP (PPO)</text>
<rect x="668" y="246" width="370" height="54" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="273.0" r="11" fill="#2E7D32"/>
<text x="651" y="277.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">1</text>
<text x="680" y="267" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Collect experience</text>
<text x="680" y="284" font-size="10.5" text-anchor="start" fill="#444">run π in 8 simulators × 256 decisions = 2,048 samples</text>
<path d="M651,284.0 L651,338.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="668" y="322" width="370" height="54" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="349.0" r="11" fill="#2E7D32"/>
<text x="651" y="353.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">2</text>
<text x="680" y="343" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Score every decision: advantage</text>
<text x="680" y="360" font-size="10.5" text-anchor="start" fill="#444">Â = return actually got − V(s): better or worse than expected?</text>
<path d="M651,360.0 L651,414.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="668" y="398" width="370" height="54" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="425.0" r="11" fill="#2E7D32"/>
<text x="651" y="429.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">3</text>
<text x="680" y="419" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Update the actor (clipped)</text>
<text x="680" y="436" font-size="10.5" text-anchor="start" fill="#444">raise π where Â &gt; 0, lower where Â &lt; 0, at most ±20 % per update</text>
<path d="M651,436.0 L651,490.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
<rect x="668" y="474" width="370" height="54" rx="8" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.5"/>
<circle cx="651" cy="501.0" r="11" fill="#2E7D32"/>
<text x="651" y="505.5" font-size="12" text-anchor="middle" fill="white" font-weight="bold">4</text>
<text x="680" y="495" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Update the critic</text>
<text x="680" y="512" font-size="10.5" text-anchor="start" fill="#444">fit V(s) to the real returns; entropy bonus keeps exploring</text>
<path d="M1038,501.0 L1052,501.0 L1052,273.0 L1038,273.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1064" y="387.0" font-size="11.5" text-anchor="middle" fill="#2E7D32" font-weight="bold" transform="rotate(-90 1064 387.0)">repeat</text>
</svg>