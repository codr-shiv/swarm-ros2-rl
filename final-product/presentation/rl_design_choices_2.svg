<text x="48" y="345" font-size="16" font-weight="bold">3 · What the policy sees, does and earns</text>
<rect x="48" y="363" width="82" height="22" rx="11" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.4"/>
<text x="89" y="378" font-size="11" text-anchor="middle" fill="#1F5FA8" font-weight="bold">OBSERVE</text>
<text x="142" y="379" font-size="12" text-anchor="start" fill="#333" font-weight="bold">153 numbers: 12 nearest frontiers × 12 features + 9 global</text>
<text x="142" y="397" font-size="11.5" text-anchor="start" fill="#666">per frontier: position, distance, size, unknown area nearby,</text>
<text x="142" y="413" font-size="11.5" text-anchor="start" fill="#666">distance to the other robot and its goal, heading, heuristic’s pick</text>
<text x="142" y="429" font-size="11.5" text-anchor="start" fill="#666">global: both robot positions, other robot’s goal, % explored, time</text>
<rect x="48" y="447" width="82" height="22" rx="11" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.4"/>
<text x="89" y="462" font-size="11" text-anchor="middle" fill="#7B3FA6" font-weight="bold">ACT</text>
<text x="142" y="463" font-size="12" text-anchor="start" fill="#333" font-weight="bold">pick 1 of the 12 frontiers (slot k)</text>
<text x="142" y="479" font-size="11.5" text-anchor="start" fill="#666">empty or invalid slots are masked; Nav2 drives the robot there</text>
<rect x="48" y="497" width="82" height="22" rx="11" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.4"/>
<text x="89" y="512" font-size="11" text-anchor="middle" fill="#B26A00" font-weight="bold">REWARD</text>
<text x="142" y="513" font-size="12" text-anchor="start" fill="#333" font-weight="bold">+0.1 per newly mapped m²  ·  −0.01 per second</text>
<text x="142" y="529" font-size="11.5" text-anchor="start" fill="#666">every run maps the same area, so higher return = faster</text>
<rect x="555" y="315" width="515" height="228" rx="12" fill="#FAFAFA" stroke="#DDD" stroke-width="1.5"/>
<text x="573" y="345" font-size="16" font-weight="bold">4 · Train in a fast 2D simulator</text>
