<text x="685" y="455" font-size="11.5" text-anchor="middle" fill="#666">decisions / s</text>
<text x="685" y="470" font-size="10.5" text-anchor="middle" fill="#666">8 parallel envs (measured)</text>
<rect x="830" y="381" width="220" height="96" rx="10" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.6"/>
<text x="940" y="403" font-size="12.5" text-anchor="middle" fill="#1F5FA8" font-weight="bold">Gazebo, headless</text>
<text x="940" y="437" font-size="30" text-anchor="middle" fill="#1F5FA8" font-weight="bold">≈ 0.7</text>
<text x="940" y="455" font-size="11.5" text-anchor="middle" fill="#666">decisions / s</text>
<text x="940" y="470" font-size="10.5" text-anchor="middle" fill="#666">8 parallel stacks, best case</text>
<text x="812.5" y="505" font-size="15" text-anchor="middle" fill="#7B3FA6" font-weight="bold">≈ 300× more decisions per second</text>
<text x="812.5" y="525" font-size="11" text-anchor="middle" fill="#666">policy converged after ≈ 30k decisions · Gazebo: ≈ 20 decisions per 240 s run</text>
