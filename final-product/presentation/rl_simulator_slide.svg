<text x="687" y="174" font-size="11.5" text-anchor="middle" fill="#666">decisions / s</text>
<text x="687" y="191" font-size="10.5" text-anchor="middle" fill="#666">8 parallel envs (measured)</text>
<rect x="826" y="92" width="224" height="112" rx="10" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.6"/>
<text x="938" y="116" font-size="12.5" text-anchor="middle" fill="#1F5FA8" font-weight="bold">Gazebo, headless</text>
<text x="938" y="154" font-size="32" text-anchor="middle" fill="#1F5FA8" font-weight="bold">≈ 0.7</text>
<text x="938" y="174" font-size="11.5" text-anchor="middle" fill="#666">decisions / s</text>
<text x="938" y="191" font-size="10.5" text-anchor="middle" fill="#666">8 parallel stacks, best case</text>
<text x="812.5" y="242" font-size="16" text-anchor="middle" fill="#7B3FA6" font-weight="bold">≈ 300× more decisions per second</text>
<text x="812.5" y="268" font-size="11" text-anchor="middle" fill="#666">Gazebo makes ≈ 20 decisions per 240 s run · the policy needed ≈ 30k to converge</text>
