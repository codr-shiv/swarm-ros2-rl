<text x="535" y="438" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Update the actor (clipped)</text>
<text x="535" y="454" font-size="11" text-anchor="start" fill="#444">raise π of slots with Â &gt; 0, lower Â &lt; 0; each by at most ±20 % per update</text>
<path d="M505,452.0 L505,484.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
