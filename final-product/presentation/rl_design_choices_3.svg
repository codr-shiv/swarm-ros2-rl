<text x="535" y="384" font-size="12.5" text-anchor="start" fill="#333" font-weight="bold">Score every decision: advantage</text>
<text x="535" y="400" font-size="11" text-anchor="start" fill="#444">Â = (return actually got) − V(s)  →  better or worse than expected?</text>
<path d="M505,398.0 L505,430.0" fill="none" stroke="#333" stroke-width="1.4" marker-end="url(#arr)"/>
