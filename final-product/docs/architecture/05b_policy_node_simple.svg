<path d="M540,95.0 L560.0,95.0 L560.0,95.0 L580,95.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M810,95.0 L830.0,95.0 L830.0,95.0 L850,95.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M955.0,130 L955.0,152.5 L175.0,152.5 L175.0,175" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M310,242.5 L345.0,242.5 L345.0,305.0 L380,305.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M310,387.5 L345.0,387.5 L345.0,305.0 L380,305.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M580,305.0 L605.0,305.0 L605.0,305.0 L630,305.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<path d="M830,305.0 L855.0,305.0 L855.0,305.0 L880,305.0" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="40" y="60" width="230" height="70" rx="9" fill="#E8F1FB" stroke="#1F5FA8" stroke-width="1.8"/>
<text x="155.0" y="91" text-anchor="middle" font-weight="bold">Gazebo 3D world</text>
<text x="155.0" y="107" text-anchor="middle" fill="#444" font-size="12">2 TurtleBot3s: lidar + odometry</text>
<rect x="310" y="60" width="230" height="70" rx="9" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.8"/>
<text x="425.0" y="91" text-anchor="middle" font-weight="bold">SLAM + map merge</text>
<text x="425.0" y="107" text-anchor="middle" fill="#444" font-size="12">2D /map, robot poses from TF</text>
<rect x="580" y="60" width="230" height="70" rx="9" fill="#EAF6EC" stroke="#2E7D32" stroke-width="1.8"/>
<text x="695.0" y="91" text-anchor="middle" font-weight="bold">Resample to training grid</text>
<text x="695.0" y="107" text-anchor="middle" fill="#444" font-size="12">0.05 m cells, as in rl_sim</text>
<rect x="850" y="60" width="210" height="70" rx="9" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.8"/>
<text x="955.0" y="91" text-anchor="middle" font-weight="bold">Frontier candidates</text>
<text x="955.0" y="107" text-anchor="middle" fill="#444" font-size="12">12 nearest reachable</text>
<rect x="40" y="175" width="270" height="135" rx="9" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.8"/>
<text x="175.0" y="214" text-anchor="middle" font-weight="bold">Per candidate: 12 numbers</text>
<text x="175.0" y="230" text-anchor="middle" fill="#444" font-size="12">position, distance, size</text>
<text x="175.0" y="246" text-anchor="middle" fill="#444" font-size="12">unknown area around it</text>
<text x="175.0" y="262" text-anchor="middle" fill="#444" font-size="12">distance to other robot + its goal</text>
<text x="175.0" y="278" text-anchor="middle" fill="#444" font-size="12">heading, heuristic&#x27;s pick</text>
<rect x="40" y="335" width="270" height="105" rx="9" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.8"/>
<text x="175.0" y="368" text-anchor="middle" font-weight="bold">Global: 9 numbers</text>
<text x="175.0" y="384" text-anchor="middle" fill="#444" font-size="12">both robot positions</text>
<text x="175.0" y="400" text-anchor="middle" fill="#444" font-size="12">other robot&#x27;s goal</text>
<text x="175.0" y="416" text-anchor="middle" fill="#444" font-size="12">% mapped, elapsed time</text>
<rect x="380" y="265" width="200" height="80" rx="9" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.8"/>
<text x="480.0" y="301" text-anchor="middle" font-weight="bold">153-D observation</text>
<text x="480.0" y="317" text-anchor="middle" fill="#444" font-size="12">12 × 12 + 9</text>
<rect x="630" y="265" width="200" height="80" rx="9" fill="#F3E8FA" stroke="#7B3FA6" stroke-width="1.8"/>
<text x="730.0" y="293" text-anchor="middle" font-weight="bold">PPO policy</text>
<text x="730.0" y="309" text-anchor="middle" fill="#444" font-size="12">scores the 12 slots</text>
<text x="730.0" y="325" text-anchor="middle" fill="#444" font-size="12">(empty slots masked)</text>
<rect x="880" y="265" width="190" height="80" rx="9" fill="#FFF4E0" stroke="#B26A00" stroke-width="1.8"/>
<text x="975.0" y="293" text-anchor="middle" font-weight="bold">Best frontier</text>
<text x="975.0" y="309" text-anchor="middle" fill="#444" font-size="12">slot k → world (x, y)</text>
<text x="975.0" y="325" text-anchor="middle" fill="#444" font-size="12">NavigateToPose → Nav2</text>
<text x="569" y="148" font-size="11.5" fill="#333" text-anchor="start" paint-order="stroke" stroke="white" stroke-width="4">for the robot that needs a goal</text>
<text x="855" y="298" font-size="11.5" fill="#333" text-anchor="middle" paint-order="stroke" stroke="white" stroke-width="4">slot k</text>
<rect x="30" y="464" width="14" height="12" fill="#E8F1FB" stroke="#1F5FA8"/><text x="50" y="474" font-size="12">Gazebo</text>
<rect x="30" y="486" width="14" height="12" fill="#FFF4E0" stroke="#B26A00"/><text x="50" y="496" font-size="12">SLAM / Nav2</text>
<rect x="30" y="508" width="14" height="12" fill="#EAF6EC" stroke="#2E7D32"/><text x="50" y="518" font-size="12">ROS glue</text>
<rect x="30" y="530" width="14" height="12" fill="#F3E8FA" stroke="#7B3FA6"/><text x="50" y="540" font-size="12">same env code as training (no reimplementation drift)</text>
</svg>